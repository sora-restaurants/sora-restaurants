<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<title>EquiGrowth introduction film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05070d; color: #ddd; font: 14px system-ui; }
  #out { display: block; width: 96vw; max-height: 88vh; margin: 2vh auto 0; aspect-ratio: 16 / 9; object-fit: contain; }
  #bar { text-align: center; padding: 6px; }
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<div id="bar">?t=12 one frame · ?play self-playing preview with voice (click once) · ?render encode MP4 + captions · &amp;nocaptions <span id="status"></span></div>
<script type="module">
// EquiGrowth introduction film, 1920 x 1080. Flat cartoon, follows Ayanda (customer) and Thandi (appointed consultant).
// Every frame is a pure function of time once the voice is loaded: scenes start at their first voice line, and
// all reveals are keyed to the line that talks about them (A(id) = when line id starts, E(id) = when it ends).
const W = 1920, H = 1080, FPS = 25;
const SITE = "myequigrowth.com";
const DISCLOSURE = "MyEquiGrowth (Pty) Ltd is a juristic representative of Sibiya Brokers, FSP 46798.";
const NAVY = "#0e1626", NAVY2 = "#16213a", CARD = "#1b2945", GOLD = "#e0a72e", GOLD_D = "#b9761c", INK = "#141a26", GREEN = "#2f8f4e", PAPER = "#fbfaf6";
const F = "Poppins, system-ui, sans-serif";
const params = new URLSearchParams(location.search);
const sm = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const seg = (t, a, b) => sm((t - a) / (b - a));
const backOut = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const pop = (t, a, d = 0.35) => (t < a ? 0 : backOut((t - a) / d));
const lerp = (a, b, k) => a + (b - a) * k;

const out = document.getElementById("out"), ctx = out.getContext("2d");
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const fill = (c) => { ctx.fillStyle = c; ctx.fill(); };
const stroke = (c, w) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); };
const circle = (x, y, r, c) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); fill(c); };
const ell = (x, y, rx, ry, c, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); fill(c); };
const line = (x1, y1, x2, y2, c, w) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineCap = "round"; stroke(c, w); };
const text = (s, x, y, size, color, weight = 700, align = "left", style = "") => { ctx.font = `${style} ${weight} ${size}px ${F}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y); };
const alpha = (a, fn) => { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); };
const around = (x, y, s, r, fn) => { if (s <= 0.001) return; ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, s); fn(); ctx.restore(); };
const goldGrad = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, "#c47a1c"); g.addColorStop(0.35, "#b36d1a"); g.addColorStop(0.75, "#f2c63a"); g.addColorStop(1, "#d39b22"); return g; };

// ---------- timeline from the voice ----------
let LINES = [], BY = {}, SCENE_AT = [], DURATION = 900;
const A = (id) => BY[id].at, E = (id) => BY[id].at + BY[id].len;
const talkOf = (t, ids) => (ids.some((id) => t >= A(id) && t <= E(id)) ? 0.3 + 0.7 * Math.abs(Math.sin(t * 13) * Math.sin(t * 7.3)) : 0);

// ---------- the client's logo, redrawn from their file (made for a dark background) ----------
function logo(x, y, s, tagline = true, build = 1) {
  around(x, y, s, 0, () => {
    ctx.translate(-1000, -325);
    [[97, 313], [184, 259], [270, 206]].forEach(([bx, top], i) => { const k = seg(build, i * 0.15, i * 0.15 + 0.35), h = (510 - top) * k; ctx.fillStyle = goldGrad(bx, bx + 32); ctx.fillRect(bx, 510 - h, 32, h); });
    alpha(seg(build, 0.3, 0.7), () => {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 9; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(300, 556); ctx.lineTo(25, 556); ctx.lineTo(25, 300); ctx.lineTo(345, 102); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(374, 86); ctx.lineTo(312, 98); ctx.lineTo(344, 140); ctx.closePath(); fill("#ffffff");
    });
    alpha(seg(build, 0.45, 0.85), () => {
      ctx.font = `700 228px ${F}`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#ffffff"; ctx.fillText("EQUI", 352, 408);
      const gx = 352 + ctx.measureText("EQUI").width + 40; ctx.fillStyle = goldGrad(gx, 1955); ctx.fillText("GROWTH", gx, 408);
      if (tagline) text("Empowering Your Financial Journey", 356, 538, 96, "rgba(255,255,255,.85)", 300, "left", "italic");
    });
  });
}

// ---------- characters ----------
// Front-facing person, feet at (x, y), about 640 px tall at s = 1. seated hides the legs (a table covers them).
const AYANDA = { skin: "#8a5a3c", hair: "afro", hairC: "#1f1410", top: "#e3a33b", bottom: "#3b4a6b", ear: GOLD };
const THANDI = { skin: "#9a6646", hair: "bun", hairC: "#2a1a14", top: "#1f3b63", bottom: "#1f3b63", blazer: true, ear: GOLD, badge: true };
const MOTHER = { skin: "#7b4d33", hair: "doek", hairC: "#2f8f4e", top: "#6a4c93", bottom: "#4a3a2a" };
const SIPHO = { skin: "#6f4630", hair: "short", hairC: "#151010", top: "#2e7d6b", bottom: "#2b2f3a", badge: true };
const LWAZI = { skin: "#a87553", hair: "short", hairC: "#201510", top: "#5a6b8a", bottom: "#2b2f3a", badge: true };
const TECH = { skin: "#7a4e36", hair: "cap", hairC: "#e07a2e", top: "#e07a2e", bottom: "#2b3a55" };
function person(x, y, s, o, t, { talk = 0, armR = 0, armL = 0, seated = false, holdR = null, holdL = null, blinkSeed = 0 } = {}) {
  around(x, y, s, 0, () => {
    if (!seated) { rr(-62, -230, 52, 230, 20); fill(o.bottom); rr(10, -230, 52, 230, 20); fill(o.bottom); ell(-38, -6, 40, 16, "#1b1b20"); ell(38, -6, 40, 16, "#1b1b20"); }
    // arms behind the torso edges
    const arm = (side, ang, hold) => { ctx.save(); ctx.translate(side * 92, -420); ctx.rotate(side * (ang - 0.12)); rr(-26, 0, 52, 210, 26); fill(o.top); /* positive ang swings the hand up across the chest */ circle(0, 214, 28, o.skin); if (hold) { ctx.translate(0, 214); hold(); } ctx.restore(); };
    arm(-1, armL, holdL); arm(1, armR, holdR);
    rr(-100, -450, 200, 260, [70, 70, 20, 20]); fill(o.top);
    if (o.blazer) { ctx.beginPath(); ctx.moveTo(-40, -450); ctx.lineTo(0, -360); ctx.lineTo(40, -450); fill("#f6efe3"); }
    if (o.badge) { rr(36, -400, 44, 30, 6); fill("#ffffff"); rr(36, -400, 44, 9, [6, 6, 0, 0]); fill(GOLD); }
    rr(-28, -490, 56, 60, 20); fill(o.skin);
    // head
    const hy = -560;
    if (o.hair === "afro") circle(0, hy - 18, 92, o.hairC);
    if (o.hair === "bun") { circle(0, hy - 92, 36, o.hairC); ell(0, hy - 10, 82, 88, o.hairC); }
    ell(0, hy, 70, 80, o.skin);
    if (o.hair === "bun" || o.hair === "short") { ctx.beginPath(); ctx.ellipse(0, hy - 30, 74, 58, 0, Math.PI, 0); fill(o.hairC); }
    if (o.hair === "afro") { ctx.beginPath(); ctx.ellipse(0, hy - 40, 76, 46, 0, Math.PI, 0); fill(o.hairC); }
    if (o.hair === "doek") { ctx.beginPath(); ctx.ellipse(0, hy - 38, 86, 70, 0, Math.PI, 0); fill(o.hairC); circle(56, hy - 96, 30, o.hairC); }
    if (o.hair === "cap") { ctx.beginPath(); ctx.ellipse(0, hy - 36, 76, 52, 0, Math.PI, 0); fill(o.hairC); rr(-10, hy - 44, 110, 18, 9); fill(o.hairC); }
    const blink = ((t + blinkSeed) % 4.1) < 0.12 ? 0.15 : 1;
    for (const dx of [-26, 26]) { ell(dx, hy + 2, 8, 10 * blink, "#1c120e"); if (blink > 0.5) circle(dx + 3, hy - 2, 3, "#fff"); }
    ctx.beginPath(); ctx.moveTo(-40, hy - 22); ctx.quadraticCurveTo(-26, hy - 30, -12, hy - 22); ctx.moveTo(12, hy - 22); ctx.quadraticCurveTo(26, hy - 30, 40, hy - 22); ctx.lineCap = "round"; stroke(o.hairC === "#2f8f4e" ? "#3a2418" : o.hairC, 5);
    const m = 3 + 16 * talk;
    if (talk > 0) { ell(0, hy + 42, 20, m, "#5a1d1d"); } else { ctx.beginPath(); ctx.arc(0, hy + 32, 22, 0.25, Math.PI - 0.25); ctx.lineCap = "round"; stroke("#5a1d1d", 5); }
    ell(-44, hy + 26, 12, 7, "rgba(220,90,80,.22)"); ell(44, hy + 26, 12, 7, "rgba(220,90,80,.22)");
    if (o.ear) { circle(-70, hy + 24, 7, o.ear); circle(70, hy + 24, 7, o.ear); }
  });
}
// props held in a hand (drawn at the hand)
const holdPhone = (screen) => () => { ctx.rotate(0.15); rr(-34, -62, 68, 124, 12); fill("#11151c"); rr(-29, -54, 58, 108, 8); fill(screen ?? "#9fd3f0"); };
const holdFolder = () => { ctx.rotate(-0.1); rr(-70, -10, 140, 110, 8); fill(GOLD); rr(-70, -22, 60, 20, [6, 6, 0, 0]); fill(GOLD_D); };
const holdPaper = () => { ctx.rotate(0.1); rr(-55, -10, 110, 140, 6); fill(PAPER); for (let i = 0; i < 5; i++) { ctx.fillStyle = "#c9ccd4"; ctx.fillRect(-40, 14 + i * 20, 80 - (i % 2) * 20, 6); } };
const holdPen = () => { ctx.rotate(-0.6); rr(-4, -50, 8, 70, 3); fill(INK); };

// ---------- places ----------
function kitchen(t) {
  ctx.fillStyle = "#f1e4c9"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#e9d8b8"; ctx.fillRect(0, 0, W, 90);
  // window with a Highveld afternoon, upper cabinets, kettle, a calendar and a family photo on the fridge
  rr(140, 150, 420, 330, 16); fill("#8a5a35"); rr(160, 170, 380, 290, 10); fill("#a8d6f0"); circle(470, 240, 40, "#ffe29a");
  ctx.fillStyle = "#c9a26a"; ctx.fillRect(160, 380, 380, 80); ctx.fillStyle = "#8a5a35"; ctx.fillRect(345, 170, 10, 290); ctx.fillRect(160, 310, 380, 10);
  for (let i = 0; i < 4; i++) { rr(700 + i * 210, 120, 190, 220, 10); fill("#d98e5a"); circle(700 + i * 210 + 165, 230, 7, "#8a5a35"); }
  ctx.fillStyle = "#cfc2a8"; ctx.fillRect(640, 560, 900, 20);
  rr(1600, 150, 260, 620, 18); fill("#e8ecef"); line(1630, 420, 1830, 420, "#c5ccd2", 4); rr(1650, 210, 110, 80, 6); fill("#ffffff"); circle(1680, 260, 12, "#8a5a3c"); circle(1715, 262, 9, "#7b4d33"); circle(1740, 260, 12, "#9a6646");
  rr(1120, 400, 70, 80, 14); fill("#c0392b"); rr(1110, 470, 90, 12, 6); fill("#7f2a21");
  ctx.fillStyle = "#b98d5e"; ctx.fillRect(0, 780, W, 300);
}
function kitchenTable(x, w) { rr(x, 760, w, 34, 10); fill("#7a4a2a"); rr(x + 20, 794, w - 40, 300, 0); fill("#6b4024"); }
function office(t) {
  ctx.fillStyle = "#e9edf2"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#dfe5ec"; for (let x = 0; x < W; x += 120) ctx.fillRect(x, 0, 3, 760);
  // EquiGrowth on the wall, a plant, a shelf of files
  rr(720, 110, 480, 200, 20); fill(NAVY); logo(960, 210, 0.2, true, 1);
  rr(1450, 180, 340, 18, 6); fill("#9aa7b2"); [0, 1, 2, 3, 4, 5].forEach((i) => { rr(1470 + i * 50, 70, 40, 110, 4); fill(["#3a6ea5", GOLD, "#5a8f6b", "#c45b6b", "#3a6ea5", "#8a6bb8"][i]); });
  rr(110, 560, 130, 200, 16); fill("#b35a3a"); for (const [dx, r] of [[-40, -0.5], [0, 0], [40, 0.5], [-20, -0.2], [20, 0.25]]) ell(175 + dx, 480, 26, 90, "#3f7a52", r);
  ctx.fillStyle = "#a9b3bd"; ctx.fillRect(0, 760, W, 320);
}
function desk(x, w) { rr(x, 700, w, 40, 10); fill("#5b6b7f"); rr(x + 30, 740, w - 60, 360, 0); fill("#4b5a6d"); }
function navyGround(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, NAVY2); g.addColorStop(1, NAVY); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(224,167,46,.045)"; for (let i = 0; i < 11; i++) { const x = ((i * 210 + t * 18) % (W + 300)) - 150; ctx.fillRect(x, 0, 60, H); }
}
// ---------- UI pieces ----------
function chip(s, x, y, p, bg = NAVY, fg = GOLD, size = 34) {
  around(x, y, p, 0, () => { ctx.font = `800 ${size}px ${F}`; const w = ctx.measureText(s).width + size * 1.6; rr(-w / 2, -size * 1.25, w, size * 2.5, size * 1.25); fill(bg); text(s, 0, size * 0.36, size, fg, 800, "center"); });
}
function card(cx, cy, w, h, p, fn, bg = CARD, border = "rgba(224,167,46,.55)") {
  around(cx, cy, p, 0, () => { rr(-w / 2, -h / 2, w, h, 30); fill(bg); if (border) stroke(border, 3); fn(); });
}
function doc(x, y, w, h, title, p = 1) {
  around(x, y, p, 0, () => {
    ctx.shadowColor = "rgba(0,0,0,.18)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; rr(-w / 2, -h / 2, w, h, 14); fill(PAPER); ctx.shadowColor = "transparent";
    rr(-w / 2, -h / 2, w, 70, [14, 14, 0, 0]); fill(NAVY); text(title, -w / 2 + 30, -h / 2 + 46, 30, "#ffffff", 700);
  });
}
const tickMark = (x, y, s = 1, c = GREEN) => around(x, y, s, 0, () => { circle(0, 0, 30, c); ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-4, 11); ctx.lineTo(15, -12); ctx.lineCap = "round"; ctx.lineJoin = "round"; stroke("#fff", 7); });
function packageTag(t, a) { alpha(a, () => { rr(1480, 26, 410, 64, 32); fill(GOLD); text("Customer package: R430 per month", 1685, 68, 25, INK, 800, "center"); }); }
function proposalTag(a) { alpha(a, () => text("Revised consultant model · proposal subject to FSP, insurer and legal approval", 40, 66, 22, "rgba(255,255,255,.55)", 500)); }
function pillarBanner(t, id, name) { const p = pop(t, A(id), 0.4) * (1 - seg(t, E(id) + 0.3, E(id) + 0.7)); chip(name, W / 2, 80, p, NAVY, GOLD, 42); }

// =====================================================================================
// scenes (each: [first line id, draw(t)])
// =====================================================================================
function sHome(t) {
  kitchen(t);
  const z = lerp(1.08, 1, seg(t, 0, 6));
  around(W / 2, H / 2, z, 0, () => {
    ctx.translate(-W / 2, -H / 2);
    const write = seg(t, A("h4"), A("h4") + 2);
    person(760, 1000, 0.9, AYANDA, t, { seated: true, talk: 0, armR: 0.5 + 0.1 * Math.sin(t * 2), holdR: holdPhone(write > 0 ? "#ffffff" : "#9fd3f0") });
    person(1170, 1000, 0.85, MOTHER, t, { seated: true, armL: 0.35, blinkSeed: 1.3 });
    kitchenTable(420, 1100);
    // the folder and documents going into it
    rr(860, 700, 230, 60, 8); fill(GOLD); rr(860, 690, 90, 20, [6, 6, 0, 0]); fill(GOLD_D); text("FAMILY DOCUMENTS", 975, 740, 20, INK, 800, "center");
    for (let i = 0; i < 3; i++) { const k = seg(t, A("h4") + 2 + i * 0.9, A("h4") + 2.8 + i * 0.9); if (k <= 0) { rr(560 + i * 40, 720 - i * 6, 150, 40, 4); fill(PAPER); stroke("#d8d3c4", 2); continue; } if (k < 1) { rr(lerp(560 + i * 40, 900, k), lerp(720 - i * 6, 660, Math.sin(k * Math.PI)) , 150, 40, 4); fill(PAPER); } }
    rr(990, 735, 90, 18, 4); fill("#e9e2d0"); circle(560, 745, 26, "#ffffff"); circle(560, 745, 18, "#7a4a2a");
  });
  // the saved contact on her phone, shown large
  const ph = pop(t, A("h4") + 1.6, 0.4) * (1 - seg(t, E("h4") + 0.5, E("h4") + 1));
  around(400, 360, ph, -0.05, () => { rr(-150, -230, 300, 460, 34); fill("#11151c"); rr(-136, -212, 272, 424, 24); fill("#ffffff"); text("New contact", 0, -150, 30, INK, 800, "center"); rr(-110, -110, 220, 60, 12); fill("#eef0f4"); text("Policy & claims line", 0, -70, 24, INK, 600, "center"); rr(-110, -30, 220, 60, 12); fill("#eef0f4"); text("Consultant: Thandi", 0, 10, 24, INK, 600, "center"); rr(-90, 70, 180, 64, 32); fill(GREEN); text("Saved ✓", 0, 113, 28, "#fff", 800, "center"); });
  // the opening questions float softly above the table
  [["h1", "Who would they call?", 520, 300], ["h2", "Where is the policy?", 1400, 260]].forEach(([id, s, x, y]) => alpha(seg(t, A(id), A(id) + 0.6) * (1 - seg(t, A("h4"), A("h4") + 0.6)), () => { rr(x - 250, y - 55, 500, 100, 50); fill("rgba(14,22,38,.85)"); text(s, x, y + 14, 36, "#ffffff", 700, "center"); }));
}
function sLogo(t) {
  navyGround(t);
  const k = seg(t, A("h6"), A("h6") + 0.8);
  logo(W / 2, lerp(520, 250, k), lerp(0.6, 0.38, k), true, seg(t, A("h5"), A("h5") + 1.6));
  // the two people we follow
  [[620, AYANDA, "Ayanda", "Exploring cover for her family", 0.15], [1300, THANDI, "Thandi", "Appointed consultant", 0.45]].forEach(([x, who, name, role, f], i) => {
    const p = pop(t, A("h6") + f * BY.h6.len, 0.45);
    card(x, 690, 520, 520, p, () => {
      ctx.save(); rr(-260, -260, 520, 520, 30); ctx.clip(); person(0, 330, 0.62, who, t, { armR: i ? 0.3 : 0, blinkSeed: i }); ctx.restore();
      rr(-260, 130, 520, 130, [0, 0, 30, 30]); fill(NAVY); text(name, 0, 186, 44, "#ffffff", 800, "center"); text(role, 0, 232, 26, GOLD, 600, "center");
    });
  });
}
function sCompany(t) {
  navyGround(t);
  // c1: the brand, then the company behind it
  const b = pop(t, A("c1"), 0.4), sh = seg(t, A("c2") - 0.3, A("c2") + 0.5);
  around(W / 2, lerp(380, 150, sh), lerp(1, 0.6, sh), 0, () => {
    logo(0, -40, 0.42, false, 1);
    alpha(seg(t, A("c1") + 1.6, A("c1") + 2.2), () => { text("is the public brand of", 0, 120, 34, "rgba(255,255,255,.7)", 500, "center"); text("MyEquiGrowth (Pty) Ltd", 0, 190, 56, GOLD, 800, "center"); });
  });
  // c2: founded 2024, Black empowerment, relationships
  const r = seg(t, A("c2"), A("c2") + 0.5) * (1 - seg(t, A("c3") - 0.2, A("c3") + 0.3));
  alpha(r, () => {
    chip("Established 2024 · Black empowerment company", W / 2, 360, pop(t, A("c2")), CARD, "#ffffff", 34);
    const nodes = [["Clients", 560, 700], ["Business partners", 960, 560], ["Its own team", 1360, 700]];
    nodes.forEach(([n, x, y], i) => { const p = pop(t, A("c2") + 0.35 * BY.c2.len + i * 0.6); if (i) { const [, px, py] = nodes[i - 1]; alpha(p, () => line(px, py, x, y, "rgba(224,167,46,.6)", 5)); } chip(n, x, y, p, GOLD, INK, 36); });
    alpha(pop(t, A("c2") + 0.35 * BY.c2.len + 1.8), () => line(560, 700, 1360, 700, "rgba(224,167,46,.6)", 5));
    alpha(seg(t, A("c2") + 0.2 * BY.c2.len, A("c2") + 0.2 * BY.c2.len + 0.5), () => text("built on relationships", W / 2, 840, 40, "rgba(255,255,255,.75)", 500, "center", "italic"));
  });
  // c3: the wider ambition sits apart; this film is funeral cover
  const c = seg(t, A("c3"), A("c3") + 0.5) * (1 - seg(t, A("c4") - 0.2, A("c4") + 0.3));
  alpha(c, () => {
    card(620, 600, 640, 360, 1, () => { text("Wider ambition", 0, -90, 40, "rgba(255,255,255,.6)", 700, "center"); text("Wealth-building solutions", 0, -20, 32, "rgba(255,255,255,.45)", 500, "center"); text("with partners, over time", 0, 24, 32, "rgba(255,255,255,.45)", 500, "center"); text("A separate story", 0, 110, 28, "rgba(255,255,255,.4)", 600, "center", "italic"); }, "rgba(27,41,69,.6)", "rgba(255,255,255,.15)");
    const f = pop(t, A("c3") + 0.55 * BY.c3.len);
    card(1300, 600, 640, 360, f, () => { text("This film", 0, -90, 40, GOLD, 800, "center"); text("Funeral cover", 0, -10, 64, "#ffffff", 800, "center"); text("and the people who service it", 0, 60, 30, "rgba(255,255,255,.8)", 500, "center"); }, CARD, GOLD);
  });
  // c4: the five pillars
  const PIL = [["Stewardship", "hand"], ["Integrity", "check"], ["A cohesive team", "team"], ["Continuous improvement", "up"], ["Quality service & support", "star"]];
  PIL.forEach(([n, ic], i) => card(260 + i * 350, 620, 310, 380, pop(t, A("c4") + 0.3 + i * 0.45), () => {

const SCENES = [["h1", sHome], ["h5", sLogo], ["c1", sCompany], ["p1", sPillars], ["r1", sRoles], ["k1", sPackage], ["k3", sSchedule], ["b1", sBenefits], ["b4", sShop], ["b5", sAssist], ["b7", sDistinction],
  ["j1", sJoin], ["o1", sConsultant], ["o4", sFlow], ["l1", sLevels], ["m1", sStatement], ["s1", sService], ["s5", sMonths], ["x1", sClose], ["x6", sEnd]];
const SCENE_FIRST = new Set(SCENES.map(([id]) => id));
const HOLD = 10;

// ---------- voice ----------
const RATE = 48000;
async function loadVoice() {
  const lines = await (await fetch("voice-film/lines.json")).json();
  const ac = new OfflineAudioContext(1, RATE, RATE);
  let prevEnd = 0;
  await Promise.all(lines.map(async (l) => { l.buf = await ac.decodeAudioData(await (await fetch("voice-film/" + l.file)).arrayBuffer()); }));
  lines.forEach((l, i) => {
    const d = l.buf.getChannelData(0), thr = 0.01;
    let a = 0, b = d.length - 1; while (a < b && Math.abs(d[a]) < thr) a++; while (b > a && Math.abs(d[b]) < thr) b--;
    l.from = Math.max(0, a / l.buf.sampleRate - 0.02); l.len = (b - a) / l.buf.sampleRate + 0.06;
    // room to breathe at the opening, a longer pause where a scene changes, a short one inside a scene
    l.at = i === 0 ? 3.2 : prevEnd + (SCENE_FIRST.has(l.id) ? 1.5 : 0.5);
    if (l.id === "x6") l.at += 1.2;
    prevEnd = l.at + l.len;
  });
  return lines;
}
// captions: each line split at sentence and clause ends, timed by length across the spoken line
let CAPS = [];
function buildCaptions() {
  CAPS = [];
  for (const l of LINES) {
    const parts = l.caption.match(/[^.?:,]+[.?:,]?/g).map((s) => s.trim()).filter(Boolean);
    const merged = []; for (const p of parts) { const last = merged[merged.length - 1]; if (last && (last + " " + p).length < 62 && !/[.?]$/.test(last)) merged[merged.length - 1] = last + " " + p; else merged.push(p); }
    const total = merged.reduce((n, s) => n + s.length, 0); let at = l.at;
    for (const s of merged) { const d = (s.length / total) * l.len; CAPS.push([at, at + d, s.replace(/,$/, "")]); at += d; }
  }
}
function captions(t) {
  const c = CAPS.find(([a, b]) => t >= a && t < b + 0.25); if (!c) return;
  ctx.font = `700 36px ${F}`; const w = ctx.measureText(c[2]).width + 48;
  alpha(seg(t, c[0], c[0] + 0.1), () => { rr(W / 2 - w / 2, 1004 - 38, w, 72, 14); fill("rgba(10,14,22,.88)"); text(c[2], W / 2, 1015, 36, "#ffffff", 700, "center"); });
}
const fmt = (s) => { const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")},${String(ms % 1000).padStart(3, "0")}`; };
const srt = () => CAPS.map(([a, b, s], i) => `${i + 1}\n${fmt(a)} --> ${fmt(b + 0.2)}\n${s}\n`).join("\n");

// ---------- one frame ----------
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  let i = SCENE_AT.findIndex((s) => s > t) - 1; if (i < 0) i = SCENE_AT.length - 1;
  SCENES[i][1](t);
  if (!params.has("nocaptions") && i < SCENES.length - 1) captions(t);
  const u = t - SCENE_AT[i];
  if (i > 0 && u < 0.45) { const x = (u / 0.45) * (W + 900) - 450; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.moveTo(x - 200, 0); ctx.lineTo(x + 300, 0); ctx.lineTo(x - 100, H); ctx.lineTo(x - 600, H); ctx.fill(); }
  if (t < 1.2) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 1.2})`; ctx.fillRect(0, 0, W, H); }
}
async function mixVoice() {
  const ac = new OfflineAudioContext(1, Math.ceil(RATE * DURATION), RATE);
  for (const l of LINES) { const s = ac.createBufferSource(); s.buffer = l.buf; s.connect(ac.destination); s.start(l.at, l.from, l.len); }
  return ac.startRendering();
}

// ---------- modes ----------
const status = document.getElementById("status");
await Promise.all(["700 60px", "800 60px", "600 30px", "500 30px", "italic 300 60px"].map((f) => document.fonts.load(`${f} Poppins`)));
LINES = await loadVoice(); LINES.forEach((l) => (BY[l.id] = l));
SCENE_AT = SCENES.map(([id], i) => (i === 0 ? 0 : A(id) - 0.9));
DURATION = Math.ceil(E("x6") + HOLD);
buildCaptions();
window.timeline = () => ({ DURATION, scenes: SCENES.map(([id], i) => [id, +SCENE_AT[i].toFixed(1)]) });
window.renderAt = (t) => { frame(t); return t; };
window.srt = srt;
if (params.has("play")) {
  // self-playing preview: the voice plays in sync (browsers need one click to allow sound)
  status.textContent = "click the video to play with sound";
  out.addEventListener("click", async () => {
    const pcm = await mixVoice(), ac = new AudioContext(), src = ac.createBufferSource(); src.buffer = pcm; src.connect(ac.destination);
    const t0 = ac.currentTime + 0.1; src.start(t0); const loop = () => { const t = ac.currentTime - t0; frame(Math.max(0, Math.min(t, DURATION - 0.01))); if (t < DURATION) requestAnimationFrame(loop); }; loop();
  }, { once: true });
  frame(0.01);
} else if (params.has("render")) status.textContent = await encode();
else frame(Number(params.get("t") ?? 5));

async function encode() {
  const cfg = { codec: "avc1.640028", width: W, height: H, bitrate: 3_500_000, framerate: FPS };
  if (!(await VideoEncoder.isConfigSupported(cfg)).supported) return "this browser cannot encode H.264";
  const { Muxer, ArrayBufferTarget } = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm");
  const acfg = { codec: "mp4a.40.2", sampleRate: RATE, numberOfChannels: 1, bitrate: 128000 };
  if (!(await AudioEncoder.isConfigSupported(acfg)).supported) return "this browser cannot encode AAC audio";
  const target = new ArrayBufferTarget(), muxer = new Muxer({ target, video: { codec: "avc", width: W, height: H }, audio: { codec: "aac", numberOfChannels: 1, sampleRate: RATE }, fastStart: "in-memory" });
  let failed = null;
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => (failed = e) });
  enc.configure(cfg);
  const N = Math.round(DURATION * FPS);
  for (let i = 0; i < N; i++) {
    frame(i / FPS);
    const vf = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: i % 50 === 0 }); vf.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    if (failed) return `encoder error: ${failed}`;
    if (i % 25 === 0) status.textContent = `encoding ${Math.round(i / N * 100)}%`;
  }
  await enc.flush();
  status.textContent = "mixing the voice";
  const pcm = (await mixVoice()).getChannelData(0);
  const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: (e) => (failed = e) });
  aenc.configure(acfg);
  for (let i = 0; i < pcm.length; i += 1024) {
    const data = pcm.slice(i, i + 1024);
    const ad = new AudioData({ format: "f32-planar", sampleRate: RATE, numberOfFrames: data.length, numberOfChannels: 1, timestamp: Math.round(i * 1e6 / RATE), data });
    aenc.encode(ad); ad.close();
  }
  await aenc.flush();
  if (failed) return `audio encoder error: ${failed}`;
  muxer.finalize();
  const name = `equigrowth-introduction${params.has("nocaptions") ? "-no-captions" : ""}`;
  await fetch(`/save?file=${name}&name=srt`, { method: "POST", body: srt() });
  const res = await fetch(`/save?file=${name}`, { method: "POST", body: target.buffer });
  window.renderDone = await res.text();
  return window.renderDone;
}
