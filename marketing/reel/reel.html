<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<title>Sora reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #05070d; color: #ddd; font: 14px system-ui; }
  #out { display: block; height: 92vh; margin: 2vh auto 0; aspect-ratio: 9 / 16; }
  #bar { text-align: center; padding: 6px; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<div id="bar">Open with ?t=12 for one frame, ?play for a preview, ?render to encode the video. <span id="status"></span></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import qrcode from "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm";

// ---------- constants and timing helpers ----------
const W = 1080, H = 1920, FPS = 30, DURATION = 60;
const SITE = "soraqr.co.za";
const GOLD = "#d9952b", INK = "#141414", MUTED = "#6b6b6b", LINE = "#e6e6e6", GREEN = "#2f8f4e";
const F = "Inter, system-ui, sans-serif";
const sm = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const seg = (t, a, b) => sm((t - a) / (b - a));
const vis = (t, a, b, f = 0.35) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const backOut = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const pop = (t, a, d = 0.4) => (t < a ? 0 : backOut((t - a) / d));
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- 3D: the miniature restaurant ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0a0f1e");
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);

const canvasTex = (w, h, draw, repeat) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
};
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...extra });
const add = (geo, material, x, y, z, shadow = true) => {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m;
};

// seeded randomness, so every frame and every render is the same
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const brick = canvasTex(512, 512, (g) => {
  g.fillStyle = "#4a1d14"; g.fillRect(0, 0, 512, 512);
  for (let r = 0; r < 16; r++) for (let c = -1; c < 8; c++) {
    const x = c * 64 + (r % 2) * 32, y = r * 32, v = 0.85 + rnd() * 0.3;
    g.fillStyle = `rgb(${(146 * v) | 0},${(62 * v) | 0},${(44 * v) | 0})`; g.fillRect(x + 3, y + 3, 58, 26);
  }
}, [3, 1.2]);
const wood = canvasTex(512, 512, (g) => {
  for (let i = 0; i < 16; i++) {
    const v = 0.85 + rnd() * 0.25; g.fillStyle = `rgb(${(150 * v) | 0},${(92 * v) | 0},${(52 * v) | 0})`; g.fillRect(0, i * 32, 512, 32);
    g.fillStyle = "rgba(40,20,8,.55)"; g.fillRect(0, i * 32, 512, 2); g.fillRect((rnd() * 512) | 0, i * 32, 2, 32);
    for (let k = 0; k < 6; k++) { g.fillStyle = "rgba(60,30,12,.18)"; g.fillRect(rnd() * 512, i * 32 + rnd() * 30, 60 + rnd() * 120, 1.5); }
  }
}, [4, 3]);
const glowTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,210,140,1)"); gr.addColorStop(0.35, "rgba(255,180,90,.45)"); gr.addColorStop(1, "rgba(255,160,60,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const glow = (x, y, z, s, o = 0.5) => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, transparent: true, opacity: o, depthWrite: false }));
  sp.position.set(x, y, z); sp.scale.set(s, s, 1); scene.add(sp); return sp;
};

// platform, floor and walls
add(new THREE.BoxGeometry(14.6, 0.6, 12.6), mat("#2b1a10"), 0, -0.3, 0);
add(new THREE.BoxGeometry(14, 0.06, 12), mat("#ffffff", { map: wood, roughness: 0.55 }), 0, 0.03, 0, false);
add(new THREE.BoxGeometry(0.3, 4.6, 12.6), mat("#ffffff", { map: brick }), -7.15, 2.3, 0);
const backWallTex = brick.clone(); backWallTex.repeat.set(3.4, 1.2); backWallTex.needsUpdate = true;
add(new THREE.BoxGeometry(14.6, 4.6, 0.3), mat("#ffffff", { map: backWallTex }), 0, 2.3, -6.15);
add(new THREE.BoxGeometry(0.34, 0.25, 12.64), mat("#20140e"), -7.15, 4.65, 0);
add(new THREE.BoxGeometry(14.64, 0.25, 0.34), mat("#20140e"), 0, 4.65, -6.15);

// windows with a night sky on the left wall
const sky = canvasTex(256, 256, (g) => {
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#0b1a3d"); gr.addColorStop(1, "#1e3b7a");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${0.4 + rnd() * 0.6})`; g.fillRect(rnd() * 256, rnd() * 180, 2, 2); }
  g.fillStyle = "#f4efe1"; g.fillRect(0, 124, 256, 8); g.fillRect(124, 0, 8, 256);
  g.strokeStyle = "#f4efe1"; g.lineWidth = 16; g.strokeRect(0, 0, 256, 256);
});
for (const z of [-4.2, -1.2, 1.8, 4.6]) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.9), new THREE.MeshBasicMaterial({ map: sky }));
  w.position.set(-6.99, 2.6, z); w.rotation.y = Math.PI / 2; scene.add(w);
}
// the SORA neon sign and menu boards on the back wall
const neon = canvasTex(1024, 300, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.font = `800 210px ${F}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "#ffb347"; g.shadowBlur = 40; g.fillStyle = "#ffd28a"; g.fillText("SORA.", w / 2, h / 2 + 10);
  g.shadowBlur = 0; g.fillStyle = "#fff1d6"; g.fillText("SORA.", w / 2, h / 2 + 10);
});
const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 1.0), new THREE.MeshBasicMaterial({ map: neon, transparent: true }));
sign.position.set(-2.6, 3.3, -5.98); scene.add(sign);
glow(-2.6, 3.3, -5.7, 4.2, 0.35);
const board = canvasTex(256, 160, (g) => {
  g.fillStyle = "#121212"; g.fillRect(0, 0, 256, 160); g.strokeStyle = "#5a3a20"; g.lineWidth = 10; g.strokeRect(0, 0, 256, 160);
  g.fillStyle = "#e9e2d0"; for (let i = 0; i < 6; i++) { g.fillRect(24, 26 + i * 20, 120 + rnd() * 60, 5); g.fillRect(200, 26 + i * 20, 30, 5); }
});
for (const x of [1.8, 3.4, 5.0]) { const b = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.88), new THREE.MeshBasicMaterial({ map: board })); b.position.set(x, 3.45, -5.98); scene.add(b); }

// people
const SKIN = ["#f1c9a5", "#c68e65", "#8d5a3b", "#5c3a24", "#e0b089", "#a86f4a"];
const SHIRT = ["#c0563b", "#3a6ea5", "#e0a33a", "#5b8c5a", "#2f8f8a", "#d9d4c7", "#b84a62", "#7a8b99", "#c9733a"];
const HAIR = ["#1d1410", "#3b2416", "#6b4423", "#121212", "#8a6a45"];
const pick = (a) => a[(rnd() * a.length) | 0];
function person({ standing = false, shirt = pick(SHIRT), apron = false, hat = false } = {}) {
  const g = new THREE.Group();
  const base = standing ? 0.8 : 0.58;
  if (standing) for (const dx of [-0.1, 0.1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 10), mat("#2a2d36")); leg.position.set(dx, 0.4, 0); leg.castShadow = true; g.add(leg);
  }
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.42, 6, 14), mat(shirt)); body.position.y = base + 0.42; body.castShadow = true; g.add(body);
  if (apron) { const a = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.05), mat("#f2efe8")); a.position.set(0, base + 0.25, 0.21); g.add(a); }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 14), mat(pick(SKIN))); head.position.y = base + 0.95; head.castShadow = true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(pick(HAIR)));
  hair.position.y = base + 0.97; hair.rotation.x = -0.25; g.add(hair);
  if (hat) { const h = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.15, 0.28, 16), mat("#ffffff")); h.position.y = base + 1.22; g.add(h); }
  scene.add(g); return g;
}
const face = (obj, x, z) => { obj.rotation.y = Math.atan2(x - obj.position.x, z - obj.position.z); };

// tables: label 7 is the guest who orders, label 4 calls the waiter
const TABLES = [
  { l: 1, booth: true, x: -5.9, z: -4.2 }, { l: 2, booth: true, x: -5.9, z: -1.2 }, { l: 3, booth: true, x: -5.9, z: 1.8 },
  { l: 4, x: -2.8, z: -3.5 }, { l: 5, x: 0.4, z: -3.0 }, { l: 6, x: -3.0, z: 0.5 }, { l: 7, x: 0.1, z: 0.3 },
  { l: 8, x: 3.1, z: -0.4 }, { l: 9, x: -2.1, z: 3.7 }, { l: 10, x: 1.7, z: 3.4 },
];
const tableMat = mat("#3a2414", { roughness: 0.5 }), plate = mat("#f6f2ea", { roughness: 0.3 }), chair = mat("#2b1c12");
const booth = mat("#2c4fa3", { roughness: 0.6 });
for (const t of TABLES) {
  if (t.booth) {
    add(new THREE.BoxGeometry(1.1, 0.08, 1.0), tableMat, t.x, 0.75, t.z); add(new THREE.BoxGeometry(0.12, 0.72, 0.12), tableMat, t.x, 0.37, t.z);
    for (const dz of [-1, 1]) {
      add(new THREE.BoxGeometry(1.1, 0.42, 0.5), booth, t.x, 0.21, t.z + dz * 0.92);
      add(new THREE.BoxGeometry(1.1, 1.0, 0.16), booth, t.x, 0.75, t.z + dz * 1.2);
      const p = person(); p.position.set(t.x, 0, t.z + dz * 0.85); face(p, t.x, t.z);
    }
  } else {
    add(new THREE.CylinderGeometry(0.72, 0.72, 0.08, 36), tableMat, t.x, 0.75, t.z);
    add(new THREE.CylinderGeometry(0.07, 0.07, 0.72, 10), tableMat, t.x, 0.37, t.z);
    const alongX = t.l % 2 === 0;
    for (const d of [-1, 1]) {
      const px = t.x + (alongX ? d * 0.95 : 0), pz = t.z + (alongX ? 0 : d * 0.95);
      const ch = add(new THREE.BoxGeometry(0.5, 0.08, 0.5), chair, px, 0.48, pz);
      const back = add(new THREE.BoxGeometry(alongX ? 0.08 : 0.5, 0.6, alongX ? 0.5 : 0.08), chair, px + (alongX ? d * 0.25 : 0), 0.8, pz + (alongX ? 0 : d * 0.25));
      void ch; void back;
      const p = person(); p.position.set(px, 0, pz); face(p, t.x, t.z);
      add(new THREE.CylinderGeometry(0.2, 0.18, 0.03, 24), plate, t.x + (px - t.x) * 0.45, 0.8, t.z + (pz - t.z) * 0.45);
    }
  }
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 12), mat("#f3d9a0", { emissive: "#ffb347", emissiveIntensity: 1.2 }), t.x, 0.87, t.z, false);
  glow(t.x, 1.0, t.z, 2.6, 0.42);
}

// bar with bartender, kitchen pass with chef and its tablet
add(new THREE.BoxGeometry(5.2, 1.1, 0.8), mat("#2a1a10"), 3.6, 0.55, -5.1);
add(new THREE.BoxGeometry(5.4, 0.08, 1.0), mat("#c9b79a", { roughness: 0.35 }), 3.6, 1.14, -5.1);
add(new THREE.BoxGeometry(5.0, 0.06, 0.3), mat("#3a2414"), 3.6, 2.1, -5.95);
for (let i = 0; i < 10; i++) add(new THREE.CylinderGeometry(0.06, 0.07, 0.34, 10), mat(pick(["#2f5d3a", "#7a2a1a", "#c9a040", "#3a3a5a"]), { roughness: 0.2 }), 1.4 + i * 0.48, 2.3, -5.95);
const bartender = person({ standing: true, shirt: "#1f1f24", apron: true }); bartender.position.set(4.2, 0, -5.75);
add(new THREE.BoxGeometry(0.9, 1.0, 5.0), mat("#2e2f33"), 6.25, 0.5, -1.2);
add(new THREE.BoxGeometry(1.0, 0.07, 5.1), mat("#c7ccd3", { metalness: 0.6, roughness: 0.3 }), 6.25, 1.03, -1.2);
for (const z of [-3, -2.2, 0.4]) add(new THREE.CylinderGeometry(0.2, 0.18, 0.04, 24), plate, 6.1, 1.08, z);
const chef = person({ standing: true, shirt: "#f4f4f4", hat: true }); chef.position.set(6.75, 0, -1.2); face(chef, 0, -1.2);
const kitchenScreen = canvasTex(320, 220, (g) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, 320, 220); g.fillStyle = "#ececec"; g.fillRect(0, 0, 320, 34);
  for (let c = 0; c < 3; c++) for (let r = 0; r < 2 + (c === 1); r++) { g.fillStyle = c === 0 && r === 0 ? "#f3c36b" : "#f1f1f1"; g.fillRect(10 + c * 103, 44 + r * 58, 92, 50); }
});
add(new THREE.BoxGeometry(0.06, 0.6, 0.06), mat("#222"), 6.0, 1.35, -1.2);
const tablet = add(new THREE.BoxGeometry(1.1, 0.72, 0.05), mat("#111"), 6.0, 1.8, -1.2);
tablet.rotation.y = -Math.PI / 4;
const screen3d = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.64), new THREE.MeshBasicMaterial({ map: kitchenScreen }));
screen3d.position.set(0, 0, 0.03); tablet.add(screen3d);

// outside: bushes and a street lamp
for (const [x, z, r] of [[-8.4, 6.6, 1.1], [8.2, 6.4, 1.3], [8.4, -5.4, 1.0], [-8.6, -5.8, 0.9]]) add(new THREE.SphereGeometry(r, 24, 18), mat("#16393a", { roughness: 0.9 }), x, r * 0.55, z);
add(new THREE.CylinderGeometry(0.06, 0.08, 3.2, 10), mat("#1c1c22"), -6.6, 1.6, 6.9);
add(new THREE.SphereGeometry(0.22, 16, 12), mat("#fff3d0", { emissive: "#ffd58a", emissiveIntensity: 2 }), -6.6, 3.3, 6.9, false);
glow(-6.6, 3.3, 6.9, 2.4, 0.6);

// the waiter, who walks a loop and later answers table 4
const waiter = person({ standing: true, shirt: "#1f1f24", apron: true });
const WAIT_PATH = [[0, 2.5, -1.8], [1.5, 1.6, 1.8], [3, -1.2, 2.0], [4.5, -1.5, -1.2], [6, 1.8, -1.6], [7.5, 2.5, -1.8]];
const CALL_PATH = [[24, 2.2, -1.6], [26.2, 2.2, -1.6], [27.4, -0.6, -2.0], [28.6, -1.9, -3.0], [60, -1.9, -3.0]];
function waiterAt(t) {
  const path = t < 24 ? WAIT_PATH : CALL_PATH;
  const lt = t < 24 ? t % 7.5 : t;
  let i = 0; while (i < path.length - 2 && lt > path[i + 1][0]) i++;
  const [ta, xa, za] = path[i], [tb, xb, zb] = path[i + 1];
  const k = sm((lt - ta) / (tb - ta));
  const x = lerp(xa, xb, k), z = lerp(za, zb, k);
  const moving = k > 0 && k < 1;
  waiter.position.set(x, moving ? Math.abs(Math.sin(t * 9)) * 0.05 : 0, z);
  if (moving) face(waiter, xb, zb); else if (t >= 28.6) face(waiter, -2.8, -3.5);
}

// numbered rings on the floor around every table, for the closing shot
const ringMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
const numberSprites = [];
for (const t of TABLES) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.25, 64), ringMat); ring.rotation.x = -Math.PI / 2; ring.position.set(t.x, 0.08, t.z); scene.add(ring);
  const tex = canvasTex(128, 128, (g) => {
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(64, 64, 54, 0, 7); g.fill();
    g.fillStyle = INK; g.font = `800 64px ${F}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(t.l), 64, 68);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthTest: false }));
  sp.position.set(t.x, 2.3, t.z); sp.scale.set(0.7, 0.7, 1); scene.add(sp); numberSprites.push(sp);
}

// lights
scene.add(new THREE.HemisphereLight("#7d8fd6", "#3a2412", 0.55));
const key = new THREE.DirectionalLight("#ffe2b8", 1.5);
key.position.set(6, 14, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); key.shadow.bias = -0.0005;
scene.add(key);
for (const [x, z] of [[-3, -2], [1, 2], [3, -3], [-4, 3]]) { const p = new THREE.PointLight("#ffb46b", 18, 9, 2); p.position.set(x, 3, z); scene.add(p); }

// camera keys: [time, zoom, target x, y, z]
const SHOTS = [
  [0, 1.3, 0.3, 0.6, 0], [3.0, 1.38, 0.3, 0.6, 0], [5.4, 2.4, 0.1, 0.9, 0.3], [13.0, 2.4, 0.1, 0.9, 0.3],
  [14.6, 2.0, 5.2, 1.2, -1.4], [24.0, 2.0, 5.2, 1.2, -1.4], [25.4, 1.8, -1.0, 0.9, -2.4], [29.0, 1.8, -1.0, 0.9, -2.4],
  [30.4, 1.25, 0, 0.6, 0], [40.0, 1.3, 0, 0.6, 0], [53.0, 1.25, 0.2, 0.6, 0], [57.0, 1.18, 0.2, 0.6, 0], [60, 1.12, 0.2, 0.6, 0],
];
function cameraAt(t) {
  let i = 0; while (i < SHOTS.length - 2 && t > SHOTS[i + 1][0]) i++;
  const a = SHOTS[i], b = SHOTS[i + 1], k = sm((t - a[0]) / (b[0] - a[0]));
  const zoom = lerp(a[1], b[1], k), target = new THREE.Vector3(lerp(a[2], b[2], k), lerp(a[3], b[3], k), lerp(a[4], b[4], k));
  const sway = Math.sin(t * 0.25) * 0.06;
  const dir = new THREE.Vector3(Math.cos(Math.PI / 4 + sway), 0.95, Math.sin(Math.PI / 4 + sway)).normalize();
  camera.position.copy(target).addScaledVector(dir, 60); camera.lookAt(target);
  const vh = 34 / zoom, vw = vh * (W / H);
  Object.assign(camera, { left: -vw / 2, right: vw / 2, top: vh / 2, bottom: -vh / 2 }); camera.updateProjectionMatrix();
}
const toScreen = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };

// ---------- 2D overlay ----------
const out = document.getElementById("out"), ctx = out.getContext("2d");
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };
const font = (size, weight = 700, italic = false) => { ctx.font = `${italic ? "italic " : ""}${weight} ${size}px ${F}`; };
const text = (s, x, y, size, color = INK, weight = 700, align = "left") => { font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y); };
function wrap(s, maxW) { const words = s.split(" "), lines = []; let line = ""; for (const w of words) { const n = line ? `${line} ${w}` : w; if (ctx.measureText(n).width > maxW && line) { lines.push(line); line = w; } else line = n; } lines.push(line); return lines; }
const withAlpha = (a, fn) => { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); };
const scaled = (cx, cy, s, fn) => { ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); };
function chip(x, y, label, bg, fg = "#fff", size = 22) { font(size, 700); const w = ctx.measureText(label).width + 30; rr(x, y, w, size + 18, 8); ctx.fillStyle = bg; ctx.fill(); text(label, x + 15, y + size + 4, size, fg, 700); return w; }

const qr = qrcode(0, "M"); qr.addData(`https://${SITE}`); qr.make();
function drawQr(x, y, size) {
  const n = qr.getModuleCount(), m = size / n; ctx.fillStyle = INK;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(x + c * m, y + r * m, Math.ceil(m), Math.ceil(m));
}

// phone: 560 x 1140, screen inset 22

window.renderAt = (t) => { frame(t); return t; };
if (params.has("play")) {
  const start = performance.now(); const loop = () => { frame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); }; loop();
} else if (params.has("render")) {
  status.textContent = await encode();
} else {
  frame(Number(params.get("t") ?? 8));
}

async function encode() {
  const mp4 = { codec: "avc1.640028", width: W, height: H, bitrate: 10_000_000, framerate: FPS };
  const useMp4 = (await VideoEncoder.isConfigSupported(mp4)).supported;
  const lib = useMp4 ? await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm") : await import("https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/+esm");
  const target = new lib.ArrayBufferTarget();
  const muxer = useMp4
    ? new lib.Muxer({ target, video: { codec: "avc", width: W, height: H }, fastStart: "in-memory" })
    : new lib.Muxer({ target, video: { codec: "V_VP9", width: W, height: H } });
  let failed = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (failed = e) });
  enc.configure(useMp4 ? mp4 : { codec: "vp09.00.40.08", width: W, height: H, bitrate: 10_000_000, framerate: FPS });
  const total = DURATION * FPS;
  for (let i = 0; i < total; i++) {
    frame(i / FPS);
    const vf = new VideoFrame(out, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    if (failed) return `encoder error: ${failed}`;
    if (i % 30 === 0) status.textContent = `encoding ${Math.round(i / total * 100)}%`;
  }
  await enc.flush(); muxer.finalize();
  const res = await fetch(`/save?name=${useMp4 ? "mp4" : "webm"}`, { method: "POST", body: target.buffer });
  window.renderDone = `${await res.text()} (${(target.buffer.byteLength / 1e6).toFixed(1)} MB)`;
  return window.renderDone;
}
</script>
